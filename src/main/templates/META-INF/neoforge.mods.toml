license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="JaguarM"
logoFile="${mod_id}.png"

description='''
Two mining drills, and nothing else.

A Burner Mining Drill runs on solid fuel. An Electric Mining Drill runs on FE, takes four
modules, and reaches further. Both dig straight down beneath themselves, take only ore
unless you tell them otherwise, and push what they find into whatever container you put
beside them.

Modules trade one thing for another rather than being straight upgrades: speed against
running cost, or a wider area. A button in the drill's screen switches between taking only
ore, clearing everything and filling the hole, or clearing everything and leaving a pit.

Drills mine at exactly vanilla speed for the tool they hold, show you the block they are
working and the area they cover, and mine as the player who placed them, so land
protection applies to them as it would to you.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
